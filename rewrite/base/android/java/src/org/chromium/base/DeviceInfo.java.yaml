substitutions:
  - description: |-
      Treat devices reporting FEATURE_PC as desktops without requiring an
      `is_desktop_android` build, matching `--force-desktop-android`.
    regex:
      re_pattern: '(mIDeviceInfo\.isDesktop =.+?)BuildConfig\.IS_DESKTOP_ANDROID\s+&& '
      re_flags: [DOTALL]
      replace: '\1'
